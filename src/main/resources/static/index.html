<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
<head>
<title>ShopEase</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18",
    "react-dom": "https://esm.sh/react-dom@18"
  }
}
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html {
  height: 100%;
}
body { 
  background: linear-gradient(135deg, #0f1419 0%, #1a2332 50%, #0d1b2a 100%);
  color:#e0c896; 
  font-family:DM Sans,sans-serif;
  min-height: 100vh;
  height: 100%;
}
#root {
  min-height: 100vh;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import React from 'react';
  import ReactDOM from 'react-dom';
  import {App} from "./js/app.js";
  
  console.log('React loaded:', typeof React);
  console.log('ReactDOM loaded:', typeof ReactDOM);
  
  try {
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
    console.log('App rendered successfully');
  } catch (error) {
    console.error('Failed to render app:', error);
    console.error('Stack:', error.stack);
    document.getElementById("root").innerHTML = '<div style="color:red;padding:20px;font-family:monospace;"><h2>Error Loading App</h2><p>' + error.message + '</p><p>' + error.stack + '</p></div>';
  }
  
  window.addEventListener('error', (event) => {
    console.error('Global error:', event.error);
  });
  
  window.addEventListener('unhandledrejection', (event) => {
    console.error('Unhandled promise rejection:', event.reason);
  });
</script>
</body>
</html>
