<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg:#f4efe6;--surface:#faf7f2;--surface2:#ede7db;--border:#d8cfc2;
      --gold:#2d5a3d;--gold-light:#3d7a53;--text:#1c1812;--muted:#8a7f72;
      --danger:#c0392b;--success:#276b45;
      --font-display:'Cormorant Garamond',serif;--font-body:'DM Sans',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--surface2);}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px;}
    .header{position:sticky;top:0;z-index:100;background:rgba(244,239,230,0.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);box-shadow:0 1px 20px rgba(44,34,20,0.08);padding:0 3rem;height:72px;display:flex;align-items:center;justify-content:space-between;}
    .logo{font-family:var(--font-display);font-size:1.8rem;font-weight:600;letter-spacing:0.08em;}.logo span{color:var(--gold);}
    .nav{display:flex;gap:0.5rem;align-items:center;}
    .nav-btn{background:none;border:none;color:var(--muted);font-family:var(--font-body);font-size:0.85rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:0.5rem 1.2rem;border-radius:4px;cursor:pointer;transition:color 0.2s;}
    .nav-btn:hover{color:var(--text);}.nav-btn.active{color:var(--gold);}
    .cart-btn-nav{background:var(--gold);color:#faf7f2;font-family:var(--font-body);font-size:0.85rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:0.6rem 1.4rem;border:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:0.6rem;transition:background 0.2s,transform 0.15s;}
    .cart-btn-nav:hover{background:var(--gold-light);transform:translateY(-1px);}
    .cart-badge{background:#1c1812;color:#f4efe6;font-size:0.7rem;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .main{max-width:1300px;margin:0 auto;padding:3rem 2rem;}
    .page{animation:fadeUp 0.4s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .page-header{margin-bottom:2.5rem;}
    .page-header h1{font-family:var(--font-display);font-size:3rem;font-weight:300;letter-spacing:0.02em;line-height:1.1;}
    .page-header h1 em{font-style:italic;color:var(--gold);}
    .page-header p{color:var(--muted);font-size:0.9rem;margin-top:0.5rem;}
    .search-row{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;}
    .search-input-wrap{flex:1;min-width:220px;position:relative;}
    .search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);}
    .search-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:0.9rem;padding:0.75rem 1rem 0.75rem 2.6rem;border-radius:6px;outline:none;transition:border-color 0.2s;}
    .search-input:focus{border-color:var(--gold);}.search-input::placeholder{color:var(--muted);}
    .filter-pills{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:2rem;}
    .pill{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:var(--font-body);font-size:0.78rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;padding:0.45rem 1rem;border-radius:100px;cursor:pointer;transition:all 0.2s;}
    .pill:hover{border-color:var(--gold);color:var(--gold);}.pill.active{background:var(--gold);border-color:var(--gold);color:#faf7f2;font-weight:600;}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;}
    .product-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color 0.3s,transform 0.3s,box-shadow 0.3s;}
    .product-card:hover{border-color:var(--gold);transform:translateY(-6px);box-shadow:0 20px 40px rgba(44,34,20,0.14),0 0 0 1px rgba(45,90,61,0.15);}
    .product-img-wrap{position:relative;height:200px;background:var(--surface2);overflow:hidden;}
    .product-img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s ease;}
    .product-card:hover .product-img{transform:scale(1.06);}
    .category-tag{position:absolute;top:12px;left:12px;background:rgba(250,247,242,0.92);color:var(--gold);font-size:0.68rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:0.3rem 0.7rem;border-radius:100px;border:1px solid rgba(201,168,76,0.3);}
    .stock-tag{position:absolute;top:12px;right:12px;font-size:0.68rem;font-weight:600;padding:0.3rem 0.7rem;border-radius:100px;}
    .in-stock{background:rgba(39,107,69,0.12);color:#276b45;border:1px solid rgba(39,107,69,0.25);}.low-stock{background:rgba(160,112,32,0.12);color:#a07020;border:1px solid rgba(160,112,32,0.25);}.out-stock{background:rgba(192,57,43,0.12);color:#c0392b;border:1px solid rgba(192,57,43,0.25);}
    .product-body{padding:1.2rem;}
    .product-name{font-family:var(--font-display);font-size:1.15rem;font-weight:600;line-height:1.3;margin-bottom:0.4rem;}
    .product-desc{font-size:0.8rem;color:var(--muted);line-height:1.5;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .product-footer{display:flex;align-items:center;justify-content:space-between;gap:0.8rem;}
    .price{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--gold);}
    .add-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:0.78rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:0.5rem 1rem;border-radius:5px;cursor:pointer;transition:all 0.2s;white-space:nowrap;min-width:110px;text-align:center;}
    .add-btn:hover:not(:disabled){background:var(--gold);border-color:var(--gold);color:#0a0a0a;}
    .add-btn:disabled{opacity:0.35;cursor:not-allowed;}
    .add-btn.added{background:rgba(82,201,138,0.15);border-color:var(--success);color:var(--success);}
    .add-btn.loading-btn{opacity:0.6;cursor:wait;}
    .skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;}
    @keyframes shimmer{to{background-position:-200% 0;}}
    .empty-state{grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--muted);}
    .empty-icon{font-size:3rem;margin-bottom:1rem;opacity:0.4;}
    .empty-state h3{font-family:var(--font-display);font-size:1.5rem;font-weight:400;margin-bottom:0.5rem;color:var(--text);}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:3rem;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.2rem 1.5rem;}
    .stat-label{font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem;}
    .stat-value{font-family:var(--font-display);font-size:2rem;font-weight:700;color:var(--gold);}
    .stat-sub{font-size:0.78rem;color:var(--muted);margin-top:0.2rem;}
    /* API activity indicator */
    .api-pill{display:inline-flex;align-items:center;gap:0.4rem;background:rgba(45,90,61,0.08);border:1px solid rgba(45,90,61,0.25);color:var(--success);font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:0.3rem 0.8rem;border-radius:100px;margin-bottom:1.5rem;}
    .api-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
    .api-log{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.8rem 1rem;margin-bottom:1.5rem;font-size:0.78rem;font-family:monospace;color:var(--muted);max-height:80px;overflow-y:auto;}
    .api-log .log-entry{padding:0.15rem 0;border-bottom:1px solid #161616;}
    .api-log .log-entry:last-child{border-bottom:none;color:var(--success);}
    .log-method{color:var(--gold);font-weight:700;margin-right:0.5rem;}
    .cart-layout{display:grid;grid-template-columns:1fr 360px;gap:2rem;align-items:start;}
    @media(max-width:900px){.cart-layout{grid-template-columns:1fr;}}
    .cart-item{display:flex;gap:1.2rem;align-items:center;padding:1.2rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:1rem;transition:border-color 0.2s;animation:fadeUp 0.3s ease;}
    .cart-img{width:80px;height:80px;border-radius:8px;object-fit:cover;background:var(--surface2);flex-shrink:0;}
    .cart-info{flex:1;min-width:0;}
    .cart-name{font-family:var(--font-display);font-size:1.05rem;font-weight:600;margin-bottom:0.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cart-cat{font-size:0.75rem;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;}
    .qty-row{display:flex;align-items:center;gap:0.8rem;margin-top:0.8rem;}
    .qty-btn{width:30px;height:30px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
    .qty-btn:hover{border-color:var(--gold);color:var(--gold);}
    .qty-num{font-weight:600;min-width:24px;text-align:center;}
    .cart-price{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--gold);text-align:right;flex-shrink:0;}
    .remove-btn{background:none;border:none;color:#b0a090;font-size:1rem;cursor:pointer;padding:0.3rem;transition:color 0.2s;}
    .remove-btn:hover{color:var(--danger);}
    .order-summary{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.5rem;position:sticky;top:90px;}
    .summary-title{font-family:var(--font-display);font-size:1.3rem;font-weight:600;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border);}
    .summary-row{display:flex;justify-content:space-between;font-size:0.85rem;color:var(--muted);margin-bottom:0.6rem;}
    .summary-total{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;margin-top:1rem;border-top:1px solid var(--border);}
    .total-label{font-weight:600;font-size:1rem;}
    .total-amount{font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:var(--gold);}
    .checkout-btn{width:100%;margin-top:1.5rem;padding:1rem;background:var(--gold);color:#faf7f2;font-family:var(--font-body);font-size:0.9rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border:none;border-radius:6px;cursor:pointer;transition:background 0.2s,transform 0.15s;}
    .checkout-btn:hover{background:var(--gold-light);transform:translateY(-1px);}
    .modal-backdrop{position:fixed;inset:0;background:rgba(28,24,18,0.6);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn 0.2s ease;}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2.5rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(.16,1,.3,1);}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
    .modal-title{font-family:var(--font-display);font-size:1.8rem;font-weight:400;margin-bottom:0.3rem;}
    .modal-title em{font-style:italic;color:var(--gold);}
    .modal-sub{color:var(--muted);font-size:0.85rem;margin-bottom:2rem;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    .form-full{grid-column:1/-1;}
    .field{display:flex;flex-direction:column;gap:0.4rem;}
    .field label{font-size:0.75rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
    .field input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-body);font-size:0.9rem;padding:0.75rem 1rem;outline:none;transition:border-color 0.2s;}
    .field input:focus{border-color:var(--gold);}.field input::placeholder{color:#444;}
    .modal-actions{display:flex;gap:1rem;margin-top:2rem;}
    .btn-ghost{flex:1;padding:0.85rem;background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--font-body);font-size:0.85rem;border-radius:6px;cursor:pointer;transition:all 0.2s;}
    .btn-ghost:hover{border-color:var(--text);color:var(--text);}
    .btn-gold{flex:2;padding:0.85rem;background:var(--gold);border:none;color:#faf7f2;font-family:var(--font-body);font-size:0.85rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;border-radius:6px;cursor:pointer;transition:background 0.2s;}
    .btn-gold:hover{background:var(--gold-light);}.btn-gold:disabled{opacity:0.5;cursor:not-allowed;}
    .section-divider{display:flex;align-items:center;gap:1rem;margin:2rem 0;color:var(--muted);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;}
    .section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .success-state{text-align:center;padding:4rem 2rem;}
    .success-ring{width:80px;height:80px;border-radius:50%;border:2px solid var(--gold);background:rgba(45,90,61,0.06);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1.5rem;animation:popIn 0.5s cubic-bezier(.16,1,.3,1);}
    @keyframes popIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
    .success-state h2{font-family:var(--font-display);font-size:2rem;font-weight:400;}
    .success-state h2 em{font-style:italic;color:var(--gold);}
    .btn-outline{display:inline-block;margin-top:2rem;padding:0.8rem 2rem;border:1px solid var(--gold);color:var(--gold);background:none;font-family:var(--font-body);font-size:0.85rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border-radius:6px;cursor:pointer;transition:all 0.2s;}
    .btn-outline:hover{background:var(--gold);color:#0a0a0a;}
    .order-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.2rem;animation:fadeUp 0.3s ease;}
    .order-head{display:flex;justify-content:space-between;align-items:flex-start;padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);}
    .order-id{font-family:var(--font-display);font-size:1.1rem;font-weight:600;}
    .order-meta{font-size:0.78rem;color:var(--muted);margin-top:0.2rem;}
    .status-badge{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0.35rem 0.9rem;border-radius:100px;}
    .status-CONFIRMED{background:rgba(39,107,69,0.1);color:#276b45;border:1px solid rgba(39,107,69,0.2);}
    .status-PENDING{background:rgba(180,120,30,0.1);color:#a07020;border:1px solid rgba(180,120,30,0.2);}
    .status-SHIPPED{background:rgba(40,90,180,0.1);color:#2855b0;border:1px solid rgba(40,90,180,0.2);}
    .status-DELIVERED{background:rgba(100,50,180,0.1);color:#6030b0;border:1px solid rgba(100,50,180,0.2);}
    .status-PROCESSING{background:rgba(180,90,40,0.1);color:#a05020;border:1px solid rgba(180,90,40,0.2);}
    .status-CANCELLED{background:rgba(180,40,40,0.1);color:#b02020;border:1px solid rgba(180,40,40,0.2);}
    .order-items-wrap{padding:1rem 1.5rem;}
    .order-line{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;font-size:0.88rem;border-bottom:1px solid var(--border);}
    .order-line:last-child{border-bottom:none;}
    .order-line-qty{color:var(--muted);font-size:0.8rem;margin-left:0.5rem;}
    .order-line-price{color:var(--gold);font-family:var(--font-display);font-size:1rem;font-weight:700;}
    .order-foot{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;background:var(--surface2);font-size:0.9rem;}
    .order-ship{font-size:0.78rem;color:var(--muted);}
    .order-total-amount{font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--gold);}
    .toast-wrap{position:fixed;bottom:2rem;right:2rem;z-index:999;display:flex;flex-direction:column;gap:0.8rem;}
    .toast{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.9rem 1.4rem;font-size:0.88rem;font-weight:500;display:flex;align-items:center;gap:0.8rem;box-shadow:0 8px 30px rgba(44,34,20,0.15);animation:slideRight 0.3s cubic-bezier(.16,1,.3,1);min-width:260px;}
    @keyframes slideRight{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
    .toast.success{border-left:3px solid var(--success);}.toast.error{border-left:3px solid var(--danger);}.toast.info{border-left:3px solid var(--gold);}
    @media(max-width:600px){.header{padding:0 1rem;}.main{padding:1.5rem 1rem;}.page-header h1{font-size:2rem;}.form-grid{grid-template-columns:1fr;}.stats-row{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useCallback, useRef } = React;
  const API = 'http://localhost:8080/api';

  // ── SESSION ID ────────────────────────────────────────────────────────────────
  // Generate a unique session ID and store it in localStorage
  // This identifies this browser's cart in the DB
  function getSessionId() {
    let sid = localStorage.getItem('shopease_session');
    if (!sid) {
      sid = 'sess_' + Math.random().toString(36).substr(2,9) + '_' + Date.now();
      localStorage.setItem('shopease_session', sid);
    }
    return sid;
  }
  const SESSION_ID = getSessionId();

  // ── TOAST ─────────────────────────────────────────────────────────────────────
  function ToastContainer({ toasts }) {
    return (
      <div className="toast-wrap">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.type}`}>
            <span>{t.type==='success'?'✓':t.type==='error'?'✕':'◈'}</span>{t.msg}
          </div>
        ))}
      </div>
    );
  }

  // ── API LOG ───────────────────────────────────────────────────────────────────
  // Shows live API calls being made in the UI
  function ApiLog({ logs }) {
    const ref = useRef(null);
    useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [logs]);
    if (logs.length === 0) return null;
    return (
      <div>
        <div className="api-pill"><span className="api-dot"></span>Live API Activity</div>
        <div className="api-log" ref={ref}>
          {logs.map((l,i) => (
            <div key={i} className="log-entry">
              <span className="log-method">{l.method}</span>
              <span style={{color:'#888'}}>{l.url}</span>
              {l.status && <span style={{color: l.status<300?'var(--success)':'var(--danger)',marginLeft:'0.5rem'}}>→ {l.status}</span>}
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ── SKELETON ──────────────────────────────────────────────────────────────────
  function SkeletonCard() {
    return (
      <div className="product-card" style={{pointerEvents:'none'}}>
        <div className="skeleton" style={{height:200}}/>
        <div style={{padding:'1.2rem',display:'flex',flexDirection:'column',gap:'0.6rem'}}>
          <div className="skeleton" style={{height:12,width:'40%'}}/>
          <div className="skeleton" style={{height:18,width:'80%'}}/>
          <div className="skeleton" style={{height:12,width:'100%'}}/>
          <div className="skeleton" style={{height:12,width:'70%'}}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:'0.5rem'}}>
            <div className="skeleton" style={{height:22,width:70}}/>
            <div className="skeleton" style={{height:32,width:110,borderRadius:5}}/>
          </div>
        </div>
      </div>
    );
  }

  // ── PRODUCT CARD ──────────────────────────────────────────────────────────────
  function ProductCard({ product, onAdd, loadingId }) {
    const isLoading = loadingId === product.id;
    const stockStatus = product.stockQuantity===0?'out':product.stockQuantity<=5?'low':'in';
    return (
      <div className="product-card">
        <div className="product-img-wrap">
          <img className="product-img" src={product.imageUrl} alt={product.name}
            onError={e=>e.target.src='https://via.placeholder.com/300x200/111111/c9a84c?text=Product'}/>
          <span className="category-tag">{product.category}</span>
          <span className={`stock-tag ${stockStatus==='in'?'in-stock':stockStatus==='low'?'low-stock':'out-stock'}`}>
            {stockStatus==='in'?'● In Stock':stockStatus==='low'?`● Only ${product.stockQuantity} left`:'● Out of Stock'}
          </span>
        </div>
        <div className="product-body">
          <div className="product-name">{product.name}</div>
          <div className="product-desc">{product.description}</div>
          <div className="product-footer">
            <div className="price">${parseFloat(product.price).toFixed(2)}</div>
            <button
              className={`add-btn${isLoading?' loading-btn':''}`}
              onClick={()=>onAdd(product)}
              disabled={product.stockQuantity===0||isLoading}
            >
              {product.stockQuantity===0?'Sold Out':isLoading?'Adding...':'+ Add to Cart'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── PRODUCTS PAGE ─────────────────────────────────────────────────────────────
  function ProductsPage({ onAdd, cartCount, loadingId, apiLogs }) {
    const [products, setProducts] = useState([]);
    const [categories, setCategories] = useState([]);
    const [search, setSearch] = useState('');
    const [activeCategory, setActiveCategory] = useState('');
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      Promise.all([
        fetch(`${API}/products`).then(r=>r.json()),
        fetch(`${API}/products/categories`).then(r=>r.json())
      ]).then(([prods,cats])=>{setProducts(prods);setCategories(cats);setLoading(false);})
       .catch(()=>setLoading(false));
    }, []);

    const filtered = products.filter(p => {
      const ms = !search||p.name.toLowerCase().includes(search.toLowerCase())||(p.description||'').toLowerCase().includes(search.toLowerCase());
      const mc = !activeCategory||p.category===activeCategory;
      return ms&&mc;
    });

    return (
      <div className="page">
        <div className="page-header">
          <h1>Our <em>Collection</em></h1>
          <p>{products.length} products · Session: <span style={{color:'var(--gold)',fontFamily:'monospace',fontSize:'0.8rem'}}>{SESSION_ID}</span></p>
        </div>

        {/* LIVE API LOG — shows every API call being made */}
        <ApiLog logs={apiLogs}/>

        {!loading && products.length>0 && (
          <div className="stats-row">
            <div className="stat-card"><div className="stat-label">Products</div><div className="stat-value">{products.length}</div><div className="stat-sub">Available now</div></div>
            <div className="stat-card"><div className="stat-label">Categories</div><div className="stat-value">{categories.length}</div><div className="stat-sub">Curated collections</div></div>
            <div className="stat-card"><div className="stat-label">In Cart</div><div className="stat-value">{cartCount}</div><div className="stat-sub">Saved in DB</div></div>
          </div>
        )}

        <div className="search-row">
          <div className="search-input-wrap">
            <span className="search-icon">⌕</span>
            <input className="search-input" placeholder="Search products..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
        </div>

        {categories.length>0 && (
          <div className="filter-pills">
            <button className={`pill${!activeCategory?' active':''}`} onClick={()=>setActiveCategory('')}>All</button>
            {categories.map(cat=>(
              <button key={cat} className={`pill${activeCategory===cat?' active':''}`} onClick={()=>setActiveCategory(cat)}>{cat}</button>
            ))}
          </div>
        )}

        <div className="product-grid">
          {loading ? Array(6).fill(0).map((_,i)=><SkeletonCard key={i}/>)
           : filtered.length===0
             ? <div className="empty-state"><div className="empty-icon">◎</div><h3>No products found</h3></div>
             : filtered.map(p=><ProductCard key={p.id} product={p} onAdd={onAdd} loadingId={loadingId}/>)
          }
        </div>
      </div>
    );
  }

  // ── CHECKOUT MODAL ────────────────────────────────────────────────────────────
  function CheckoutModal({ cart, onClose, onSuccess, addToast, addLog }) {
    const [form, setForm] = useState({name:'',email:'',phone:'',address:''});
    const [loading, setLoading] = useState(false);
    const items = cart;
    const total = items.reduce((s,i)=>s+parseFloat(i.product.price)*i.quantity,0);
    const set = (k,v) => setForm(f=>({...f,[k]:v}));

    const placeOrder = async () => {
      if(!form.name||!form.email||!form.address){addToast('Please fill in all required fields','error');return;}
      setLoading(true);
      const url = `${API}/orders/checkout`;
      addLog({method:'POST',url:'/api/orders/checkout'});
      try {
        const res = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            sessionId: SESSION_ID,
            customerName:form.name,customerEmail:form.email,phone:form.phone,
            shippingAddress:form.address,
            items:items.map(i=>({productId:i.product.id,quantity:i.quantity}))
          })});
        addLog({method:'POST',url:'/api/orders/checkout',status:res.status});
        if(res.ok){const order=await res.json();onSuccess(order);}
        else{const err=await res.text();addToast(err||'Order failed','error');}
      }catch{addToast('Could not connect to server','error');}
      finally{setLoading(false);}
    };

    return (
      <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal">
          <div className="modal-title">Complete <em>Order</em></div>
          <div className="modal-sub">{items.length} items · Total ${total.toFixed(2)}</div>
          <div className="section-divider">Delivery Details</div>
          <div className="form-grid">
            <div className="field"><label>Full Name *</label><input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Jane Smith"/></div>
            <div className="field"><label>Phone</label><input value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="+1 555-0100"/></div>
            <div className="field form-full"><label>Email Address *</label><input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="jane@example.com"/></div>
            <div className="field form-full"><label>Shipping Address *</label><input value={form.address} onChange={e=>set('address',e.target.value)} placeholder="123 Main St, City, State 10001"/></div>
          </div>
          <div className="section-divider">Order Summary</div>
          {items.map(i=>(
            <div key={i.product.id} style={{display:'flex',justifyContent:'space-between',fontSize:'0.85rem',padding:'0.35rem 0',color:'var(--muted)'}}>
              <span>{i.product.name} × {i.quantity}</span>
              <span style={{color:'var(--gold)'}}>${(parseFloat(i.product.price)*i.quantity).toFixed(2)}</span>
            </div>
          ))}
          <div style={{display:'flex',justifyContent:'space-between',paddingTop:'0.8rem',marginTop:'0.5rem',borderTop:'1px solid var(--border)',fontWeight:600}}>
            <span>Total</span>
            <span style={{fontFamily:'var(--font-display)',fontSize:'1.3rem',color:'var(--gold)'}}>${total.toFixed(2)}</span>
          </div>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn-gold" onClick={placeOrder} disabled={loading}>{loading?'Placing Order...':'Place Order →'}</button>
          </div>
        </div>
      </div>
    );
  }

  // ── CART PAGE ─────────────────────────────────────────────────────────────────
  function CartPage({ onQty, onRemove, addToast, addLog }) {
    const [cartItems, setCartItems] = useState([]);
    const [loading, setLoading] = useState(true);
    const [showCheckout, setShowCheckout] = useState(false);
    const [success, setSuccess] = useState(null);

    // Load cart from DB on mount
    const loadCart = async () => {
      setLoading(true);
      addLog({method:'GET', url:`/api/cart/${SESSION_ID}`});
      try {
        const res = await fetch(`${API}/cart/${SESSION_ID}`);
        addLog({method:'GET', url:`/api/cart/${SESSION_ID}`, status:res.status});
        const data = await res.json();
        setCartItems(data);
      } catch { addToast('Could not load cart','error'); }
      finally { setLoading(false); }
    };

    useEffect(() => { loadCart(); }, []);

    const handleQty = async (productId, newQty) => {
      addLog({method:'PUT', url:`/api/cart/${SESSION_ID}/item/${productId}`});
      const res = await fetch(`${API}/cart/${SESSION_ID}/item/${productId}?quantity=${newQty}`,{method:'PUT'});
      addLog({method:'PUT', url:`/api/cart/${SESSION_ID}/item/${productId}`, status:res.status});
      await loadCart();
      onQty();
    };

    const handleRemove = async (productId) => {
      addLog({method:'DELETE', url:`/api/cart/${SESSION_ID}/item/${productId}`});
      const res = await fetch(`${API}/cart/${SESSION_ID}/item/${productId}`,{method:'DELETE'});
      addLog({method:'DELETE', url:`/api/cart/${SESSION_ID}/item/${productId}`, status:res.status});
      await loadCart();
      onQty();
      addToast('Item removed from cart','info');
    };

    const subtotal = cartItems.reduce((s,i)=>s+parseFloat(i.product.price)*i.quantity,0);
    const shipping = subtotal>0?9.99:0;
    const tax = subtotal*0.08;

    if(success) return (
      <div className="page">
        <div className="success-state">
          <div className="success-ring">✓</div>
          <h2>Order <em>Confirmed!</em></h2>
          <p>Order #{success.id} saved to database · Cart cleared from DB</p>
          <button className="btn-outline" onClick={()=>window.location.reload()}>Continue Shopping</button>
        </div>
      </div>
    );

    if(loading) return <div className="page"><div style={{color:'var(--muted)',padding:'3rem',textAlign:'center'}}>Loading cart from database...</div></div>;

    if(cartItems.length===0) return (
      <div className="page">
        <div className="page-header"><h1>Your <em>Cart</em></h1></div>
        <div className="empty-state" style={{border:'1px solid var(--border)',borderRadius:10,background:'var(--surface)'}}>
          <div className="empty-icon">◫</div><h3>Your cart is empty</h3><p>Add products — they'll be saved to the database instantly</p>
        </div>
      </div>
    );

    return (
      <div className="page">
        <div className="page-header">
          <h1>Your <em>Cart</em></h1>
          <p>{cartItems.length} items · Loaded from DB · Session: <span style={{color:'var(--gold)',fontFamily:'monospace',fontSize:'0.8rem'}}>{SESSION_ID}</span></p>
        </div>
        <div className="cart-layout">
          <div>
            {cartItems.map(item=>(
              <div key={item.id} className="cart-item">
                <img className="cart-img" src={item.product.imageUrl} alt={item.product.name}
                  onError={e=>e.target.src='https://via.placeholder.com/80x80/111/c9a84c?text=P'}/>
                <div className="cart-info">
                  <div className="cart-name">{item.product.name}</div>
                  <div className="cart-cat">{item.product.category}</div>
                  <div className="qty-row">
                    <button className="qty-btn" onClick={()=>handleQty(item.product.id, item.quantity-1)}>−</button>
                    <span className="qty-num">{item.quantity}</span>
                    <button className="qty-btn" onClick={()=>handleQty(item.product.id, item.quantity+1)}>+</button>
                    <span style={{fontSize:'0.78rem',color:'var(--muted)',marginLeft:'0.5rem'}}>× ${parseFloat(item.product.price).toFixed(2)}</span>
                  </div>
                </div>
                <div>
                  <div className="cart-price">${(parseFloat(item.product.price)*item.quantity).toFixed(2)}</div>
                  <button className="remove-btn" onClick={()=>handleRemove(item.product.id)} style={{display:'block',margin:'0.5rem 0 0 auto'}}>✕</button>
                </div>
              </div>
            ))}
          </div>
          <div className="order-summary">
            <div className="summary-title">Order Summary</div>
            <div className="summary-row"><span>Subtotal ({cartItems.length} items)</span><span>${subtotal.toFixed(2)}</span></div>
            <div className="summary-row"><span>Shipping</span><span>${shipping.toFixed(2)}</span></div>
            <div className="summary-row"><span>Tax (8%)</span><span>${tax.toFixed(2)}</span></div>
            <div className="summary-total">
              <span className="total-label">Total</span>
              <span className="total-amount">${(subtotal+shipping+tax).toFixed(2)}</span>
            </div>
            <button className="checkout-btn" onClick={()=>setShowCheckout(true)}>Proceed to Checkout →</button>
          </div>
        </div>
        {showCheckout&&<CheckoutModal
          cart={cartItems}
          onClose={()=>setShowCheckout(false)}
          onSuccess={order=>{setShowCheckout(false);setSuccess(order);addToast(`Order #${order.id} placed!`,'success');onQty();}}
          addToast={addToast}
          addLog={addLog}
        />}
      </div>
    );
  }

  // ── ORDERS PAGE ───────────────────────────────────────────────────────────────
  function OrdersPage({ addLog }) {
    const [orders, setOrders] = useState([]);
    const [loading, setLoading] = useState(true);
    useEffect(()=>{
      addLog({method:'GET',url:'/api/orders'});
      fetch(`${API}/orders`)
        .then(r=>{addLog({method:'GET',url:'/api/orders',status:r.status});return r.json();})
        .then(d=>{setOrders(d);setLoading(false);})
        .catch(()=>setLoading(false));
    },[]);
    return (
      <div className="page">
        <div className="page-header"><h1>Order <em>History</em></h1><p>{orders.length} orders in database</p></div>
        {loading?<div style={{color:'var(--muted)',padding:'3rem',textAlign:'center'}}>Loading from database...</div>
         :orders.length===0
           ?<div className="empty-state" style={{border:'1px solid var(--border)',borderRadius:10,background:'var(--surface)'}}><div className="empty-icon">◈</div><h3>No orders yet</h3></div>
           :orders.map(order=>(
             <div key={order.id} className="order-card">
               <div className="order-head">
                 <div>
                   <div className="order-id">Order #{order.id}</div>
                   <div className="order-meta">{order.customer?.name} · {order.createdAt&&new Date(order.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
                 </div>
                 <span className={`status-badge status-${order.status}`}>{order.status}</span>
               </div>
               <div className="order-items-wrap">
                 {order.items?.map(item=>(
                   <div key={item.id} className="order-line">
                     <div><span>{item.product?.name}</span><span className="order-line-qty">× {item.quantity}</span></div>
                     <span className="order-line-price">${(parseFloat(item.priceAtOrder)*item.quantity).toFixed(2)}</span>
                   </div>
                 ))}
               </div>
               <div className="order-foot">
                 <div className="order-ship">📍 {order.shippingAddress||'—'}</div>
                 <div style={{display:'flex',alignItems:'center',gap:'1rem'}}>
                   <span style={{fontWeight:600}}>Total</span>
                   <span className="order-total-amount">${parseFloat(order.totalAmount).toFixed(2)}</span>
                 </div>
               </div>
             </div>
           ))
        }
      </div>
    );
  }

  // ── APP ───────────────────────────────────────────────────────────────────────
  function App() {
    const [page, setPage] = useState('products');
    const [cartCount, setCartCount] = useState(0);
    const [toasts, setToasts] = useState([]);
    const [apiLogs, setApiLogs] = useState([]);
    const [loadingId, setLoadingId] = useState(null);

    const addToast = useCallback((msg,type='info')=>{
      const id=Date.now();
      setToasts(t=>[...t,{id,msg,type}]);
      setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);
    },[]);

    // Add entry to the live API log (keep last 5)
    const addLog = useCallback((entry)=>{
      setApiLogs(l=>[...l.slice(-4), entry]);
    },[]);

    // Fetch cart count from DB
    const refreshCartCount = useCallback(async ()=>{
      try {
        const res = await fetch(`${API}/cart/${SESSION_ID}`);
        const items = await res.json();
        setCartCount(items.reduce((s,i)=>s+i.quantity,0));
      } catch {}
    },[]);

    useEffect(()=>{ refreshCartCount(); },[]);

    // ADD TO CART — calls POST /api/cart/add → inserts into DB
    const addToCart = useCallback(async (product)=>{
      setLoadingId(product.id);
      const url = '/api/cart/add';
      addLog({method:'POST', url});
      try {
        const res = await fetch(`${API}/cart/add`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({sessionId:SESSION_ID, productId:product.id, quantity:1})
        });
        addLog({method:'POST', url, status:res.status});
        if(res.ok){
          await refreshCartCount();
          addToast(`${product.name} added to cart`,'success');
        } else {
          const err = await res.text();
          addToast(err||'Could not add to cart','error');
        }
      } catch {
        addToast('Could not connect to server','error');
      } finally {
        setLoadingId(null);
      }
    },[addToast, addLog, refreshCartCount]);

    return (
      <>
        <header className="header">
          <div className="logo">Shop<span>Ease</span></div>
          <nav className="nav">
            <button className={`nav-btn${page==='products'?' active':''}`} onClick={()=>setPage('products')}>Products</button>
            <button className={`nav-btn${page==='orders'?' active':''}`} onClick={()=>setPage('orders')}>Orders</button>
            <button className="cart-btn-nav" onClick={()=>setPage('cart')}>
              Cart <span className="cart-badge">{cartCount}</span>
            </button>
          </nav>
        </header>
        <main className="main">
          {page==='products'&&<ProductsPage onAdd={addToCart} cartCount={cartCount} loadingId={loadingId} apiLogs={apiLogs}/>}
          {page==='cart'&&<CartPage onQty={refreshCartCount} onRemove={refreshCartCount} addToast={addToast} addLog={addLog}/>}
          {page==='orders'&&<OrdersPage addLog={addLog}/>}
        </main>
        <ToastContainer toasts={toasts}/>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
